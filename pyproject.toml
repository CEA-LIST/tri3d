[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=70.1", "setuptools-scm" ]

[project]
name = "tri3d"
description = "A unified interface to various 3D driving datasets"
readme = "README.md"
license = "CECILL-C"
authors = [ { name = "Nicolas Granger", email = "nicolas.granger@cea.fr" } ]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [ "numba>=0.65", "numpy", "pillow", "pyarrow>=23.0.1" ]
optional-dependencies.align-nuscenes = [ "torch", "torch-cluster", "tqdm" ]
optional-dependencies.plot = [ "k3d", "matplotlib" ]

[dependency-groups]
dev = [
  "docformatter",
  "furo",
  "ipykernel",
  "ipympl",
  "ipywidgets",
  "matplotlib",
  "nbsphinx",
  "nbstripout",
  "pyproject-fmt>=2.6",
  "pyrefly",
  "pytest",
  "pytest-cov",
  "ruff",
  "scipy",
  "sphinx",
  "sphinxcontrib-run",
]

[tool.setuptools]
packages = [ "tri3d" ]

[tool.setuptools_scm]

[tool.uv]
sources.torch-cluster = { index = "pyg" }
sources.torch-scatter = { index = "pyg" }
index = [
  { name = "pyg", url = "https://data.pyg.org/whl/torch-2.7.0+cu126.html", ignore-error-codes = [ 403 ], format = "flat" },
]
extra-build-dependencies.pyarrow = [ "pkg_resources" ]

[tool.ruff]
extend-include = [ "*.ipynb" ]
lint.extend-select = [ "I" ]
lint.fixable = [ "ALL" ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]

[tool.coverage]
report.exclude_lines = [
  "@abstractmethod",
  "__repr__",
  "raise NotImplementedError",
  "raise ValueError",
]
